<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#4A6B5D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="성경강해">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>에스라 성경강좌 </title>
  <style>
    :root {
      color-scheme: light;
      --bg: #F4F1EA;
      --bg-elev: #FFFFFF;
      --player-bg: #FAF9F6;
      --ink: #2C3327;
      --muted: #70756B;
      --line: #E5DFD5;
      --accent: #4A6B5D;
      --accent-soft: #EAEFEA;
      --on-accent: #FFFFFF;
      --shadow: 0 12px 32px rgba(44, 51, 39, 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", AppleSDGothicNeo-Regular, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    body.is-drag .wrap {
      outline: 2px dashed var(--accent);
      outline-offset: -10px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .dock {
      position: sticky;
      top: 0;
      z-index: 2;
      padding-top: 8px;
      background: var(--bg);
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      padding: 4px 0 12px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      flex: 1;
      min-width: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.55;
      word-break: keep-all;
      color: var(--ink);
    }

    .header-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-tools {
      flex-wrap: wrap;
    }

    .src-btns {
      flex: 1 1 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .src-btns .pick {
      max-width: none;
      width: 100%;
      padding: 0 10px;
    }

    .src-btns .pick[hidden] { display: none !important; }
    .src-btns .pick.warn { color: #c62828; border-color: #e3b8b8; }
    .src-btns .pick:only-child, .src-btns:has(#saveBtn[hidden]) #changeBtn { grid-column: 1 / -1; }

    .header-tools #summary {
      flex: 1 1 100%;
      min-width: 0;
    }

    #summary {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    #summary:empty {
      display: none;
    }

    .actions-left,
    .actions-right {
      display: flex;
      flex: none;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .actions-left {
      flex: 1;
      justify-content: flex-start;
    }

    .actions-right {
      justify-content: flex-end;
    }

    .pick {
      position: relative;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      max-width: 220px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button.pick {
      border: 0;
      font: inherit;
      font-weight: 700;
    }

    .pick.ghost {
      background: var(--bg-elev);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .pick[hidden] { display: none !important; }

    .pick input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .list-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      margin: 0 0 12px;
    }

    .list-nav[hidden] { display: none; }

    .up-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-elev);
      color: var(--ink);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    .up-btn[hidden] { display: none; }

    .crumbs {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      font-size: 0.9rem;
    }

    .crumbs::-webkit-scrollbar { display: none; }

    .crumbs .sep { color: var(--muted); flex: none; }

    .crumbs button {
      flex: none;
      min-height: 36px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    .crumbs button:last-child {
      color: var(--ink);
      font-weight: 700;
      cursor: default;
    }

    .section {
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list.files {
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: var(--bg-elev);
      box-shadow: var(--shadow);
    }

    .list.files .row {
      min-height: 52px;
      padding: 8px 14px;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      border-top: 1px solid var(--line);
    }

    .list.files .row:first-child {
      border-top: 0;
    }

    .row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--bg-elev);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .row .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row .meta {
      flex: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .row.is-playing {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .empty {
      margin: 28px 0;
      padding: 22px 18px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
      background: var(--bg-elev);
      box-shadow: var(--shadow);
    }

    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 1.02rem;
    }

    .empty p { margin: 0; }

    .empty ol {
      margin: 10px 0 0;
      padding-left: 20px;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .empty .actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 18px;
    }

    .big-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 0 20px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
    }

    .big-btn.ghost {
      background: var(--bg-elev);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .big-btn .sub {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skeleton {
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(90deg, #ece8de 25%, #f6f3ec 50%, #ece8de 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    .player {
      margin: 0 0 14px;
      padding: 18px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--player-bg);
      box-shadow: var(--shadow);
    }

    .player[hidden] { display: none; }

    .player-inner {
      display: grid;
      gap: 14px;
    }

    .now-playing {
      padding: 18px 0 20px;
    }

    .now-title {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.55;
      color: #1565c0;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-path {
      margin-top: 8px;
      color: #c62828;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-path:empty {
      display: none;
    }

    audio {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .playback {
      display: grid;
      gap: 14px;
    }

    .ctl-row {
      display: grid;
      grid-template-columns: 1fr 1.25fr 1fr;
      gap: 16px;
      align-items: stretch;
    }

    .ctl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .play-icon {
      display: block;
      width: 0;
      height: 0;
      margin-left: 4px;
      border-style: solid;
      border-width: 11px 0 11px 18px;
      border-color: transparent transparent transparent currentColor;
    }

    .pause-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 22px;
    }

    .pause-icon span {
      display: block;
      width: 6px;
      height: 22px;
      border-radius: 1px;
      background: currentColor;
    }

    .ctl:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .seek-wrap { min-width: 0; }

    #seek {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 18px;
      margin: 6px 0;
      border: 0;
      border-radius: 999px;
      background: var(--line);
      cursor: pointer;
    }

    #seek::-webkit-slider-runnable-track {
      height: 18px;
      border-radius: 999px;
      background: transparent;
    }

    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      margin-top: -5px;
      border: 3px solid var(--player-bg);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 4px rgba(44, 51, 39, 0.18);
    }

    #seek::-moz-range-track {
      height: 18px;
      border: 0;
      border-radius: 999px;
      background: transparent;
    }

    #seek::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border: 3px solid var(--player-bg);
      border-radius: 50%;
      background: var(--accent);
    }

    #seek:disabled { cursor: default; }

    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .sliders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 36px;
      align-items: center;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 52px;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .slider-row label {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .slider-row label .speaker-icon {
      display: block;
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .slider-row .value {
      text-align: right;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .slider-row input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 8px;
      margin: 10px 0;
      border: 0;
      border-radius: 999px;
      background: var(--line);
      cursor: pointer;
    }

    .slider-row input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: transparent;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      margin-top: -8px;
      border: 2px solid var(--player-bg);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 3px rgba(44, 51, 39, 0.16);
    }

    .slider-row input[type="range"]::-moz-range-track {
      height: 8px;
      border: 0;
      border-radius: 999px;
      background: transparent;
    }

    .slider-row input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border: 2px solid var(--player-bg);
      border-radius: 50%;
      background: var(--accent);
    }

    @media (max-width: 560px) {
      .sliders { grid-template-columns: 1fr; }
    }

    .ctl.nav {
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--ink);
    }

    .ctl.nav .label {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .ctl.nav .hint {
      max-width: 100%;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ctl.nav .hint:empty {
      display: none;
    }

    .exit-row {
      position: sticky;
      bottom: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: auto;
      padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .home-btn {
      min-height: 52px;
      padding: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }

    .home-panel[hidden] { display: none !important; }

    .home-panel {
      margin: 4px 0 18px;
    }

    body.is-home .title-row { display: none; }
    body.is-home header { padding-bottom: 10px; }

    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: min(62vh, 460px);
      padding: 28px 16px 16px;
      border-radius: 28px 28px 36px 36px;
      color: #fff;
      background:
        radial-gradient(120% 60% at 70% 12%, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 60%),
        linear-gradient(180deg, #9db3ae 0%, #6c8c88 32%, #3f6360 62%, #243f42 100%);
      box-shadow: var(--shadow);
    }

    .hero svg.hills {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 62%;
      pointer-events: none;
    }

    .hero-text {
      position: relative;
      margin: 0 0 22px;
      text-align: center;
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 14px rgba(20, 40, 40, 0.25);
    }

    .hero-text span { display: block; }
    .hero-text .l2 { color: rgba(255, 255, 255, 0.62); }

    .hero-tiles {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      min-height: 116px;
      padding: 14px 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.17);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .tile svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tile:active { background: rgba(255, 255, 255, 0.3); }
    .tile.is-off { opacity: 0.55; }
    .tile.wide {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      min-height: 60px;
    }

    .verse {
      margin: 26px 8px 8px;
      text-align: center;
      color: var(--ink);
    }

    .verse::before {
      content: "";
      display: block;
      width: 36px;
      height: 3px;
      margin: 0 auto 16px;
      border-radius: 3px;
      background: var(--accent);
      opacity: 0.55;
    }

    .verse blockquote {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.85;
      font-weight: 600;
      word-break: keep-all;
    }

    .verse figcaption {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .exit-btn {
      min-height: 52px;
      padding: 0 16px;
      border: 1px solid #c62828;
      border-radius: 999px;
      background: var(--bg-elev);
      color: #c62828;
      font: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }

    .closed-screen {
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }

    .canon-bar {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 8px;
      margin: 0 0 14px;
    }
    .canon-btn {
      min-height: 48px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-elev);
      color: var(--ink);
      font: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }
    .canon-btn[hidden] { display: none !important; }
    .canon-btn.is-on {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--on-accent);
    }
    .hymn-panel[hidden] { display: none !important; }
    #list[hidden] { display: none !important; }
    .hymn-search {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 10px;
      padding: 4px 6px 4px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-elev);
    }
    .hymn-search:focus-within { border-color: var(--accent); }
    .hymn-search input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
    }
    .hymn-search input::-webkit-search-cancel-button { display: none; }
    .hymn-search input::placeholder { color: var(--muted); }
    .hs-btn {
      flex: none;
      min-width: 44px;
      height: 40px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .hs-btn[hidden] { display: none !important; }
    .hymn-tools-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
    }
    .hymn-store-info {
      flex: 1 1 100%;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .small-btn {

    .fine-toggle {

  </style>
</head>
<body>
  <div class="wrap">
    <div class="dock">
      <header>
        <div class="title-row">
          <h1>노우호목사님 성경강해</h1>
        </div>
        <div class="header-tools">
          <p id="summary"></p>
          <div class="src-btns">
            <button type="button" id="saveBtn" class="pick" hidden>장치에 저장</button>
            <button type="button" id="changeBtn" class="pick ghost">강의 폴더 변경</button>
          </div>
        </div>
      </header>
      <section id="playerBar" class="player">
        <div class="player-inner">
          <div class="now-playing">

            <div id="nowPath" class="now-path"></div>

          <audio id="player" playsinline preload="metadata"></audio>
          <div class="playback">
            <div class="seek-wrap">
              <input id="seek" type="range" min="0" max="0" step="0.1" value="0" disabled aria-label="재생 위치">

            <div class="ctl-row">
              <button type="button" id="prev" class="ctl nav">
                <span class="label">이전</span>
                <span id="prevHint" class="hint"></span>
              </button>
              <button type="button" id="playBtn" class="ctl" disabled aria-label="재생"><span class="play-icon"></span></button>
              <button type="button" id="next" class="ctl nav">
                <span class="label">다음</span>
                <span id="nextHint" class="hint"></span>
              </button>
            </div>
          </div>
          <button type="button" id="fineToggle" class="fine-toggle" aria-expanded="false" aria-controls="sliders"></button>
          <div class="sliders" id="sliders" hidden>
            <div class="slider-row">
              <label for="speed">배속</label>
              <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="배속">

            <div class="slider-row">

                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
              </label>
              <input id="volume" type="range" min="0" max="1" step="0.01" value="0.4" aria-label="음량">

    <div class="list-nav" id="listNav" hidden>

      <form id="hymnSearch" class="hymn-search" role="search">
        <input id="hymnQuery" type="search" inputmode="search" placeholder="장 번호 또는 제목" autocomplete="off" autocapitalize="off" enterkeyhint="search" aria-label="찬송가 검색">
        <button type="button" id="hymnClear" class="hs-btn" aria-label="검색어 지우기" hidden>✕</button>
        <button type="button" id="hymnKeys" class="hs-btn" aria-label="숫자 키패드로 전환">123</button>

        <button type="button" id="hymnWipeBtn" class="small-btn danger" hidden>저장 악보 삭제</button>

        <div id="hymnViewerTitle"></div>
        <div class="hymn-tools">
          <button type="button" id="hymnAudio" disabled>강의 없음</button>
          <div class="hv-zoom">
            <button type="button" id="hymnZoomOut" aria-label="축소">−</button>
            <span id="hymnZoomVal">100%</span>

    <div class="exit-row">

      <button type="button" id="exitBtn" class="exit-btn">프로그램 종료</button>
    </div>
  </div>

  <script src="./hymns.js"></script>
  <script>
    const SPEED_KEY = "lecture-speed";
    const VOLUME_KEY = "lecture-volume";

    const summaryEl = document.getElementById("summary");
    let statusMsg = "";
    /* 기존 코드의 summary.textContent = "..." 호출을 그대로 쓰되, 빈 문자열이면 현재 상태를 표시합니다. */
    const summary = {
      set textContent(value) {
        statusMsg = value || "";
        renderSummary();
      },
      get textContent() { return statusMsg; },
    };
    const list = document.getElementById("list");
    const picker = document.getElementById("picker");
    const player = document.getElementById("player");
    const playerBar = document.getElementById("playerBar");
    const nowTitle = document.getElementById("nowTitle");
    const nowPath = document.getElementById("nowPath");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const prevHint = document.getElementById("prevHint");
    const nextHint = document.getElementById("nextHint");
    const playBtn = document.getElementById("playBtn");
    const seek = document.getElementById("seek");
    const timeNow = document.getElementById("timeNow");
    const timeTotal = document.getElementById("timeTotal");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");
    const volume = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");
    const changeBtn = document.getElementById("changeBtn");
    const listNav = document.getElementById("listNav");
    const crumbs = document.getElementById("crumbs");
    const upBtn = document.getElementById("upBtn");
    const pageTitle = document.title.trim() || "강의 듣기";
    const canRememberFolder = window.isSecureContext && typeof window.showDirectoryPicker === "function";
    let savedHandle = null;
    let restorable = false;

    let root = emptyDir();
    let basePath = [];
    let path = [];
    let loaded = false;
    let total = 0;
    let browseMode = "tree";
    let handleMap = new Map();
    let entryMap = new Map();
    let loadToken = 0;
    const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
    let currentSpeed = loadSpeed();
    let currentVolume = loadVolume();
    let current = null;
    let audioCtx = null;
    let gainNode = null;
    let mediaSource = null;
    let currentList = [];
    let currentIndex = -1;
    let currentUrl = "";
    let dragDepth = 0;
    let viewMode = "home";
    let homeForced = false;
    let listBuilding = false;
    let hymnImages = new Map();
    let hymnIndexTask = null;
    let hymnSearchText = "";
    let hymnViewIndex = -1;
    let hymnObjectUrl = "";
    let hymnStored = new Set();
    let hymnNavList = [];
    let hymnZoom = 1;
    let hymnRenderToken = 0;
    let hymnNumeric = false;
    let hymnSearchTimer = 0;
    let hymnBusy = false;
    let hymnShowToken = 0;
    const HYMN_BOOK = (typeof HYMNS !== "undefined" && Array.isArray(HYMNS)) ? HYMNS : [];
    const homePanel = document.getElementById("homePanel");
    const homeBtn = document.getElementById("homeBtn");
    const hymnSearch = document.getElementById("hymnSearch");
    const hymnQuery = document.getElementById("hymnQuery");
    const hymnList = document.getElementById("hymnList");
    const hymnViewer = document.getElementById("hymnViewer");
    const hymnViewerTitle = document.getElementById("hymnViewerTitle");
    const hymnViewerStage = document.getElementById("hymnViewerStage");
    const hymnImage = document.getElementById("hymnImage");
    const hymnViewerMsg = document.getElementById("hymnViewerMsg");
    const hymnPrev = document.getElementById("hymnPrev");
    const hymnNext = document.getElementById("hymnNext");
    const hymnClose = document.getElementById("hymnClose");

    function emptyDir() {
      return { dirs: Object.create(null), files: [], loaded: true };
    }

    function yieldUi() {
      return new Promise((resolve) => setTimeout(resolve, 0));
    }

    function collate(a, b) {
      return a.localeCompare(b, "ko", { numeric: true, sensitivity: "base" });
    }

    async function getItemFile(item) {
      if (item.file) return item.file;
      if (item.handle) item.file = await item.handle.getFile();
      else if (item.entry) item.file = await entryFile(item.entry);
      return item.file;
    }

    function isMp3(name) {
      return name.toLowerCase().endsWith(".mp3");
    }

    function loadSpeed() {
      try {
        const value = Number(localStorage.getItem(SPEED_KEY));
        if (Number.isFinite(value) && value >= 0.5 && value <= 2) return Math.round(value * 100) / 100;
      } catch (error) {
        /* 저장소를 쓸 수 없으면 기본 속도로 재생합니다. */
      }
      return 1;
    }

    function loadVolume() {
      try {
        const raw = localStorage.getItem(VOLUME_KEY);
        if (raw === null || raw === "") return 0.4;
        const value = Number(raw);
        if (Number.isFinite(value) && value >= 0 && value <= 1) return Math.round(value * 100) / 100;
      } catch (error) {
        /* 저장소를 쓸 수 없으면 기본 음량으로 재생합니다. */
      }
      return 0.4;
    }

    function splitPath(relativePath) {
      return String(relativePath).split(/[\\/]+/).filter(Boolean);
    }

    function getDir(parts) {
      let node = root;
      for (const part of parts) {
        if (!node.dirs[part]) node.dirs[part] = emptyDir();
        node = node.dirs[part];
      }
      return node;
    }

    function nodeAt(parts) {
      let node = root;
      for (const part of parts) {
        if (!node.dirs[part]) return emptyDir();
        node = node.dirs[part];
      }
      return node;
    }

    function countFiles(node) {
      let count = node.files.length;
      for (const name of Object.keys(node.dirs)) count += countFiles(node.dirs[name]);
      return count;
    }

    function defaultBase() {
      const names = Object.keys(root.dirs);
      if (names.length === 1 && root.files.length === 0) return names;
      return [];
    }

    function sortedFolders(node) {
      return Object.keys(node.dirs).filter((name) => !isHymnDirName(name)).sort(collate);
    }

    function sortedFiles(node) {
      return node.files.slice().sort((a, b) => collate(a.name, b.name));
    }

    function formatSpeed(rate) {
      return `${Number(rate).toFixed(2)}×`;
    }

    function formatVolume(level) {
      return `${Math.round(Number(level) * 100)}%`;
    }

    function paintRange(input) {
      const min = Number(input.min) || 0;
      const max = Number(input.max) || 1;
      const value = Number(input.value) || 0;
      const pct = max > min ? ((value - min) / (max - min)) * 100 : 0;
      input.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--line) ${pct}%)`;
    }

    function applySpeed() {
      player.playbackRate = currentSpeed;
      player.preservesPitch = true;
      speed.value = String(currentSpeed);
      speedValue.textContent = formatSpeed(currentSpeed);
      paintRange(speed);
      updateFineLabel();
    }

    function ensureAudioGraph() {
      if (gainNode) {
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return true;
      }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      try {
        audioCtx = new Ctx();
        mediaSource = audioCtx.createMediaElementSource(player);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = currentVolume;
        mediaSource.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        player.volume = 1;
        return true;
      } catch (error) {
        audioCtx = null;
        gainNode = null;
        mediaSource = null;
        return false;
      }
    }

    async function unlockAudio() {
      ensureAudioGraph();
      if (audioCtx && audioCtx.state === "suspended") {
        try { await audioCtx.resume(); } catch (error) {}
      }
    }

    function applyVolume() {
      volume.value = String(currentVolume);
      volumeValue.textContent = formatVolume(currentVolume);
      paintRange(volume);
      updateFineLabel();
      if (gainNode) {
        gainNode.gain.value = currentVolume;
        player.volume = 1;
      } else {
        player.volume = currentVolume;
      }
    }

    function resetPlayback() {
      player.pause();
      player.removeAttribute("src");
      player.load();
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = "";
      current = null;
      currentList = [];
      currentIndex = -1;
      nowTitle.textContent = "재생 중인 강의 없음";
      nowPath.textContent = "";
      updateTransport();
      syncPlayerUi();
      document.title = pageTitle;
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = null;
      }
    }

    function addTreeItem(item) {
      const parts = splitPath(item.relativePath);
      if (!parts.length || parts.some((part) => part.startsWith("."))) return false;
      const filename = parts.pop();
      if (!filename || !isMp3(filename)) return false;
      const folderPath = parts.slice();
      getDir(folderPath).files.push({
        name: filename,
        file: item.file,
        folderPath,
        relativePath: parts.concat(filename).join("/"),
      });
      return true;
    }

    function loadItems(items) {
      browseMode = "tree";
      handleMap = new Map();
      root = emptyDir();
      resetHymnLibrary();
      let added = 0;
      for (const item of items) {
        if (takeHymnItem(item)) continue;
        if (addTreeItem(item)) added += 1;
      }
      total = added;
      basePath = defaultBase();
      path = basePath.slice();
      loaded = true;
      resetPlayback();
      render();
    }

    async function loadItemsProgressive(fileList) {
      const token = ++loadToken;
      listBuilding = true;
      browseMode = "tree";
      handleMap = new Map();
      root = emptyDir();
      loaded = true;
      total = 0;
      basePath = [];
      path = [];
      resetHymnLibrary();
      resetPlayback();
      summary.textContent = "목록을 만드는 중입니다…";
      render();

      const files = [];
      for (const file of fileList) {
        if (!file.name || file.name.startsWith("._")) continue;
        const rel = file.webkitRelativePath || file.name;
        if (takeHymnItem({ name: file.name, file, relativePath: rel })) continue;
        if (!isMp3(file.name)) continue;
        files.push(file);
      }

      const batchSize = isMobile ? 40 : 120;
      let added = 0;
      let painted = false;
      for (let i = 0; i < files.length; i += 1) {
        if (token !== loadToken) return;
        const file = files[i];
        if (addTreeItem({
          name: file.name,
          file,
          relativePath: file.webkitRelativePath || file.name,
        })) {
          added += 1;
          total = added;
        }
        if (!painted && (added >= 20 || i === files.length - 1)) {
          basePath = defaultBase();
          path = basePath.slice();
          painted = true;
          render();
        } else if (painted && added % batchSize === 0) {
          summary.textContent = `목록을 만드는 중입니다… ${added}개`;
          render();
          await yieldUi();
        }
      }
      if (token !== loadToken) return;
      listBuilding = false;
      total = added;
      basePath = defaultBase();
      path = basePath.slice();
      summary.textContent = added
        ? ""
        : "선택한 폴더에서 mp3 파일을 찾지 못했습니다.";
      render();
    }

    function fromFileList(fileList) {
      const items = [];
      for (const file of fileList) {
        if (!isMp3(file.name) || file.name.startsWith("._")) continue;
        items.push({
          name: file.name,
          file,
          relativePath: file.webkitRelativePath || file.name,
        });
      }
      return items;
    }

    function entryFile(entry) {
      return new Promise((resolve, reject) => entry.file(resolve, reject));
    }

    function entryBatch(reader) {
      return new Promise((resolve, reject) => reader.readEntries(resolve, reject));
    }

    async function collect(entry, entryPath) {
      if (entry.isFile) {
        const file = await entryFile(entry);
        if (!file.name || file.name.startsWith("._")) return [];
        if (isMp3(file.name)) return [{ name: file.name, file, relativePath: entryPath }];
        if (isImageName(file.name) && isUnderHymm(entryPath)) {
          return [{ name: file.name, file, relativePath: entryPath }];
        }
        return [];
      }
      const reader = entry.createReader();
      const items = [];
      let batch = [];
      do {
        batch = await entryBatch(reader);
        const nested = await Promise.all(batch.map((child) => collect(child, `${entryPath}/${child.name}`)));
        for (const group of nested) items.push(...group);
      } while (batch.length > 0);
      return items;
    }

    async function fillLevel(folderPath, dirHandle) {
      const node = getDir(folderPath);
      node.dirs = Object.create(null);
      node.files = [];
      for await (const [name, child] of dirHandle.entries()) {
        if (!name || name.startsWith(".")) continue;
        if (child.kind === "directory") {
          const childNode = emptyDir();
          childNode.loaded = false;
          node.dirs[name] = childNode;
          handleMap.set(folderPath.concat(name).join("/"), child);
        } else if (child.kind === "file" && isMp3(name) && !name.startsWith("._")) {
          /* 파일 본문은 재생할 때 읽습니다(USB·대용량 폴더에서 목록이 빨리 뜨도록). */
          node.files.push({
            name,
            file: null,
            handle: child,
            folderPath: folderPath.slice(),
            relativePath: folderPath.concat(name).join("/"),
          });
        }
      }
      node.loaded = true;
      return node;
    }

    async function readDirEntries(dirEntry) {
      const reader = dirEntry.createReader();
      const all = [];
      let batch = [];
      do {
        batch = await entryBatch(reader);
        all.push(...batch);
      } while (batch.length > 0);
      return all;
    }

    async function fillLevelFromEntry(folderPath, dirEntry) {
      const node = getDir(folderPath);
      node.dirs = Object.create(null);
      node.files = [];
      const entries = await readDirEntries(dirEntry);
      for (const entry of entries) {
        if (!entry.name || entry.name.startsWith(".")) continue;
        if (entry.isDirectory) {
          const childNode = emptyDir();
          childNode.loaded = false;
          node.dirs[entry.name] = childNode;
          entryMap.set(folderPath.concat(entry.name).join("/"), entry);
        } else if (entry.isFile && isMp3(entry.name) && !entry.name.startsWith("._")) {
          node.files.push({
            name: entry.name,
            file: null,
            entry,
            folderPath: folderPath.slice(),
            relativePath: folderPath.concat(entry.name).join("/"),
          });
        }
      }
      node.loaded = true;
      return node;
    }

    async function ensurePathLoaded(parts) {
      if (browseMode !== "handle" && browseMode !== "entry") return;
      const acc = [];
      for (const part of parts) {
        acc.push(part);
        const key = acc.join("/");
        const node = nodeAt(acc);
        if (node.loaded) continue;
        summary.textContent = "이 폴더만 읽는 중입니다…";
        if (browseMode === "handle") {
          const handle = handleMap.get(key);
          if (!handle) return;
          await fillLevel(acc, handle);
        } else {
          const entry = entryMap.get(key);
          if (!entry) return;
          await fillLevelFromEntry(acc, entry);
        }
      }
      summary.textContent = "";
    }

    function openHandleDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("lecture-folder", 1);
        request.onupgradeneeded = () => {
          request.result.createObjectStore("handles");
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function readSavedHandle() {
      const db = await openHandleDb();
      try {
        return await new Promise((resolve, reject) => {
          const request = db.transaction("handles", "readonly").objectStore("handles").get("root");
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
      } finally {
        db.close();
      }
    }

    async function writeSavedHandle(handle) {
      const db = await openHandleDb();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction("handles", "readwrite");
          tx.objectStore("handles").put(handle, "root");
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    async function itemsFromDrop(dataTransfer) {
      const entries = [];
      for (const item of dataTransfer.items || []) {
        if (item.kind !== "file" || !item.webkitGetAsEntry) continue;
        const entry = item.webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
      if (!entries.length) return fromFileList(dataTransfer.files);
      const groups = await Promise.all(entries.map((entry) => collect(entry, entry.name)));
      return groups.flat();
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "";
      const total = Math.round(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      const pad = (value) => String(value).padStart(2, "0");
      if (hours > 0) return `${hours}:${pad(minutes)}:${pad(secs)}`;
      return `${minutes}:${pad(secs)}`;
    }

    function readDuration(file) {
      return new Promise((resolve) => {
        const audio = document.createElement("audio");
        audio.preload = "metadata";
        audio.style.display = "none";
        document.body.append(audio);
        const url = URL.createObjectURL(file);
        let settled = false;
        const finish = (value) => {
          if (settled) return;
          settled = true;
          resolve(Number.isFinite(value) ? value : NaN);
          URL.revokeObjectURL(url);
          audio.remove();
        };
        const onReady = () => {
          if (Number.isFinite(audio.duration)) finish(audio.duration);
        };
        audio.addEventListener("loadedmetadata", onReady);
        audio.addEventListener("durationchange", onReady);
        audio.addEventListener("error", () => finish(NaN));
        setTimeout(() => finish(NaN), 8000);
        audio.src = url;
      });
    }

    let durationActive = 0;
    const durationQueue = [];
    const durationObserver = "IntersectionObserver" in window
      ? new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            durationObserver.unobserve(entry.target);
            const job = entry.target._job;
            if (job) {
              durationQueue.push(job);
              pumpDuration();
            }
          }
        }, { rootMargin: "120px" })
      : null;

    function queueDuration(item, metaEl) {
      if (isMobile) {
        metaEl.textContent = "";
        return;
      }
      if (item.durationText) {
        metaEl.textContent = item.durationText;
        return;
      }
      metaEl.textContent = "";
      metaEl._job = { item, metaEl };
      if (durationObserver) {
        durationObserver.observe(metaEl);
      } else {
        durationQueue.push(metaEl._job);
        pumpDuration();
      }
    }

    function pumpDuration() {
      while (durationActive < 2 && durationQueue.length) {
        const job = durationQueue.shift();
        if (!job.metaEl.isConnected) continue;
        durationActive += 1;
        const task = job.item.durationTask || (job.item.durationTask = getItemFile(job.item).then((file) => readDuration(file)).catch(() => NaN).then((seconds) => {
          job.item.durationText = formatDuration(seconds);
          return job.item.durationText;
        }));
        task.then((text) => {
          if (job.metaEl.isConnected) job.metaEl.textContent = text || "—";
        }).finally(() => {
          durationActive -= 1;
          pumpDuration();
        });
      }
    }

    function updateTransport() {
      const prevItem = currentIndex > 0 ? currentList[currentIndex - 1] : null;
      const nextItem = currentIndex >= 0 && currentIndex < currentList.length - 1

      updateTransport();

      if ("mediaSession" in navigator) {

          artist: "강의",

    async function playItem(item) {
      await unlockAudio();
      if (current === item) {
        if (player.paused) player.play().catch(() => {});
        applyVolume();
        return;
      }
      let file;
      try {
        file = await getItemFile(item);
      } catch (error) {
        nowTitle.textContent = displayName(item.name);
        nowPath.textContent = "이 파일을 열 수 없습니다. 폴더를 다시 선택해 주세요.";
        playerBar.hidden = false;
        return;
      }
      const files = sortedFiles(nodeAt(item.folderPath));
      currentList = files;
      currentIndex = files.indexOf(item);
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(file);
      current = item;
      nowPath.textContent = "";
      player.src = currentUrl;
      applySpeed();
      applyVolume();
      player.play().catch(() => {});
      showNow();
      markActive();
    }

    function playDelta(delta) {
      const nextIndex = currentIndex + delta;

    const hymnSaveBtn = document.getElementById("hymnSaveBtn");
    const hymnWipeBtn = document.getElementById("hymnWipeBtn");
    const hymnNotice = document.getElementById("hymnNotice");
    const hymnImportInput = document.getElementById("hymnImportInput");
    const hymnAudio = document.getElementById("hymnAudio");
    const hymnZoomIn = document.getElementById("hymnZoomIn");
    const hymnZoomOut = document.getElementById("hymnZoomOut");
    const hymnZoomVal = document.getElementById("hymnZoomVal");
    const fineToggle = document.getElementById("fineToggle");
    const slidersBox = document.getElementById("sliders");
    const HYMN_NUMBERS = new Set(HYMN_BOOK.map((hymn) => hymn.n));

    function isHymnDirName(name) {
      return HYMN_DIR_NAMES.includes(String(name || "").toLowerCase());
    }
    function hymmDirName() {
      return Object.keys(nodeAt(basePath).dirs).find((name) => isHymnDirName(name)) || "";
    }
    function hymmAvailable() {
      return Boolean(hymmDirName()) || hymnImages.size > 0 || hymnStored.size > 0;
    }
    function findCanonDir(label) {
      const names = Object.keys(nodeAt(basePath).dirs);
      return names.find((name) => name === label)
        || names.find((name) => name.includes(label))
        || "";
    }
    function isInCanon(label) {
      const name = findCanonDir(label);
      return Boolean(name) && path[basePath.length] === name;
    }
    function isImageName(name) {
      return /\.(jpe?g|png|gif|webp|bmp|avif|heic|heif)$/i.test(name);
    }
    function isUnderHymm(relativePath) {
      const parts = splitPath(relativePath);
      if (parts.length < 2) return false;
      return parts.slice(0, -1).some((part) => isHymnDirName(part));
    }
    function chapterFromName(filename) {
      const stem = String(filename || "").replace(/\.[^.]+$/i, "").trim();
      if (!/^\d+$/.test(stem)) return null;
      const n = Number(stem);
      if (!Number.isInteger(n) || n < 1 || n > 9999) return null;
      return n;
    }
    function stemLen(name) {
      return String(name || "").replace(/\.[^.]+$/i, "").length;
    }
    function rememberHymnImage(n, item) {
      const prev = hymnImages.get(n);
      if (!prev || stemLen(item.name) < stemLen(prev.name)) hymnImages.set(n, item);
    }
    function takeHymnItem(item) {
      const name = item && item.name ? item.name : "";
      const rel = item && item.relativePath ? item.relativePath : name;
      if (!name || name.startsWith(".") || !isUnderHymm(rel) || !isImageName(name)) return false;
      const n = chapterFromName(name);
      if (n == null) return false;
      rememberHymnImage(n, {
        name,
        file: item.file || null,
        handle: item.handle || null,
        entry: item.entry || null,
        relativePath: rel,
      });
      return true;
    }
    function hymnHas(n) {
      return hymnStored.has(n) || hymnImages.has(n);
    }

    /* ---- 기기 저장소(IndexedDB) ---- */
    function openHymnDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("lecture-hymns", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("images");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    async function hymnDbRun(mode, work) {
      const db = await openHymnDb();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("images", mode);
          let out;
          try { out = work(tx.objectStore("images")); } catch (error) { reject(error); return; }
          tx.oncomplete = () => resolve(out && typeof out === "object" && "result" in out ? out.result : out);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error || new Error("저장 취소"));
        });
      } finally {
        db.close();
      }
    }
    async function loadStoredHymns() {
      try {
        const keys = await hymnDbRun("readonly", (store) => store.getAllKeys());
        hymnStored = new Set((keys || []).map(Number));
      } catch (error) {
        hymnStored = new Set();
      }
      render();
    }
    async function getStoredHymn(n) {
      const record = await hymnDbRun("readonly", (store) => store.get(n));
      return record && record.blob ? record.blob : null;
    }
    async function getHymnFile(n) {
      if (hymnStored.has(n)) {
        try {
          const blob = await getStoredHymn(n);
          if (blob) return blob;
        } catch (error) { /* 아래에서 열린 폴더의 파일을 시도합니다. */ }
      }
      const item = hymnImages.get(n);
      return item ? getItemFile(item) : null;
    }
    async function importHymnFiles(files) {
      if (hymnBusy) return;
      hymnBusy = true;
      try {
        const best = new Map();
        let skipped = 0;
        for (const file of files) {
          const n = chapterFromName(file.name);
          if (n == null || !isImageName(file.name) || !HYMN_NUMBERS.has(n)) { skipped += 1; continue; }
          const prev = best.get(n);
          if (!prev || stemLen(file.name) < stemLen(prev.name)) best.set(n, file);
        }
        const entries = Array.from(best.entries());
        if (!entries.length) {
          summary.textContent = "장 번호로 된 이미지 파일(예: 1.jpg, 001.png)을 찾지 못했습니다.";
          return;
        }
        try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (error) {}
        const BATCH = 20;
        let done = 0;
        for (let i = 0; i < entries.length; i += BATCH) {
          const part = entries.slice(i, i + BATCH);
          summary.textContent = `악보 저장 중… ${done}/${entries.length}`;
          await hymnDbRun("readwrite", (store) => {
            for (const [n, file] of part) store.put({ name: file.name, blob: file }, n);
          });
          for (const [n] of part) hymnStored.add(n);
          done += part.length;
          await yieldUi();
        }
        summary.textContent = skipped
          ? `${done}장을 저장했습니다. (번호를 알 수 없는 ${skipped}개는 건너뜀)`
          : `${done}장을 저장했습니다.`;
        render();
      } catch (error) {
        const full = error && (error.name === "QuotaExceededError" || /quota/i.test(String(error.message)));
        summary.textContent = full
          ? "저장 공간이 부족합니다. 기기 저장 공간을 확보한 뒤 다시 시도해 주세요."
          : "악보를 저장하지 못했습니다. 다시 시도해 주세요.";
        loadStoredHymns();
      } finally {
        hymnBusy = false;
      }
    }
    async function saveSessionHymns() {
      const files = [];
      summary.textContent = "열린 폴더의 악보를 읽는 중입니다…";
      for (const [n, item] of hymnImages) {
        if (hymnStored.has(n)) continue;
        try { files.push(await getItemFile(item)); } catch (error) {}
      }
      await importHymnFiles(files);
    }
    async function wipeHymns() {
      if (!window.confirm("이 기기에 저장된 찬송가 악보를 모두 삭제할까요?")) return;
      try {
        await hymnDbRun("readwrite", (store) => store.clear());
        hymnStored = new Set();
        summary.textContent = "저장된 악보를 삭제했습니다.";
      } catch (error) {
        summary.textContent = "삭제하지 못했습니다.";
      }
      render();
    }

    /* ---- 뒤로가기(이력) ---- */
    function pathExists(parts) {
      let node = root;
      for (const part of parts) {
        if (!node.dirs[part]) return false;
        node = node.dirs[part];
      }
      return true;
    }
    function navSnap() {
      return { mode: viewMode, path: path.slice(), hv: hymnViewIndex };
    }
    function pushNav() {
      try { history.pushState(navSnap(), ""); } catch (error) {}
    }
    function replaceNav() {
      try { history.replaceState(navSnap(), ""); } catch (error) {}
    }
    window.addEventListener("popstate", async (event) => {
      const st = event.state || { mode: "lectures", path: basePath.slice(), hv: -1 };
      if (!hymnViewer.hidden && !(st.hv >= 0)) closeHymnViewer();
      viewMode = st.mode === "hymn" ? "hymn" : (st.mode === "home" ? "home" : "lectures");
      if (viewMode === "home") homeForced = true;
      let target = Array.isArray(st.path) ? st.path.slice() : basePath.slice();
      if (target.length < basePath.length || !pathExists(target)) target = basePath.slice();
      path = target;
      try { await ensurePathLoaded(path); } catch (error) {}
      render();
      if (st.hv >= 0 && hymnViewer.hidden && hymnNavList[st.hv]) showHymnViewer(st.hv, true);
    });
    function requestCloseViewer() {
      if (hymnViewer.hidden) return;
      if (history.state && history.state.hv >= 0) history.back();
      else closeHymnViewer();
    }

    /* ---- 악보 보기 ---- */
    function resetHymnZoom() {
      hymnZoom = 1;
      hymnImage.style.width = "";
      hymnZoomVal.textContent = "100%";
    }
    function setHymnZoom(next, cx, cy) {
      const old = hymnZoom;
      const z = Math.max(1, Math.min(5, Math.round(next * 100) / 100));
      if (z === old) return;
      const stage = hymnViewerStage;
      const px = cx == null ? stage.clientWidth / 2 : cx;
      const py = cy == null ? stage.clientHeight / 2 : cy;
      const ratio = z / old;
      hymnZoom = z;
      hymnImage.style.width = z === 1 ? "" : `calc(min(920px, 100%) * ${z})`;
      stage.scrollLeft = (stage.scrollLeft + px) * ratio - px;
      stage.scrollTop = (stage.scrollTop + py) * ratio - py;
      hymnZoomVal.textContent = `${Math.round(z * 100)}%`;
    }
    function closeHymnViewer() {
      hymnShowToken += 1;
      hymnViewIndex = -1;
      hymnViewer.hidden = true;
      document.body.classList.remove("hymn-open");
      hymnImage.hidden = true;
      hymnImage.removeAttribute("src");
      hymnViewerMsg.hidden = true;
      resetHymnZoom();
      if (hymnObjectUrl) {
        URL.revokeObjectURL(hymnObjectUrl);
        hymnObjectUrl = "";
      }
    }
    function resetHymnLibrary() {
      viewMode = "home";
      homeForced = false;
      hymnImages = new Map();
      hymnIndexTask = null;
      hymnSearchText = "";
      hymnQuery.value = "";
      hymnClear.hidden = true;
      closeHymnViewer();
    }
    function indexHymnImages() {
      if (!hymnIndexTask) {
        hymnIndexTask = scanHymnDir().catch((error) => {
          hymnIndexTask = null;
          throw error;
        });
      }
      return hymnIndexTask;
    }
    async function scanHymnDir() {
      if (browseMode !== "handle" && browseMode !== "entry") return;
      const hymmName = hymmDirName();
      if (!hymmName) return;
      const key = basePath.concat(hymmName).join("/");
      const found = new Map();
      const put = (n, item) => {
        const prev = found.get(n);
        if (!prev || stemLen(item.name) < stemLen(prev.name)) found.set(n, item);
      };
      async function walkHandle(dirHandle) {
        for await (const [name, child] of dirHandle.entries()) {
          if (!name || name.startsWith(".")) continue;
          if (child.kind === "directory") {
            await walkHandle(child);
          } else if (child.kind === "file" && isImageName(name)) {
            const n = chapterFromName(name);
            if (n != null) put(n, { name, file: null, handle: child });
          }
        }
      }
      async function walkEntry(dirEntry) {
        const entries = await readDirEntries(dirEntry);
        for (const child of entries) {
          if (!child.name || child.name.startsWith(".")) continue;
          if (child.isDirectory) {
            await walkEntry(child);
          } else if (child.isFile && isImageName(child.name)) {
            const n = chapterFromName(child.name);
            if (n != null) put(n, { name: child.name, file: null, entry: child });
          }
        }
      }
      if (browseMode === "handle") {
        const handle = handleMap.get(key);
        if (!handle) return;
        await walkHandle(handle);
      } else {
        const entry = entryMap.get(key);
        if (!entry) return;
        await walkEntry(entry);
      }
      hymnImages = found;
    }
    function filteredHymns() {
      const q = hymnSearchText.trim();
      if (!q) return HYMN_BOOK;
      const compact = q.replace(/\s+/g, "");
      const numText = compact.endsWith("장") ? compact.slice(0, -1) : compact;
      const asNum = /^\d+$/.test(numText) ? Number(numText) : null;
      const rows = HYMN_BOOK.filter((hymn) => {
        if (asNum != null && (hymn.n === asNum || String(hymn.n).startsWith(numText))) return true;
        const title = String(hymn.title);
        return title.includes(q) || title.replace(/\s+/g, "").includes(compact);
      });
      if (asNum != null) rows.sort((a, b) => (b.n === asNum) - (a.n === asNum));
      return rows;
    }
    function updateHymnPanel() {
      const have = HYMN_BOOK.filter((hymn) => hymnHas(hymn.n)).length;
      hymnStoreInfo.textContent = hymnStored.size
        ? `이 기기에 저장된 악보 ${hymnStored.size}장`
        : "아직 이 기기에 저장된 악보가 없습니다.";
      hymnWipeBtn.hidden = hymnStored.size === 0;
      hymnSaveBtn.hidden = !Array.from(hymnImages.keys()).some((n) => !hymnStored.has(n));
      hymnNotice.replaceChildren();
      if (have === 0) {
        const box = document.createElement("div");
        box.className = "empty";
        box.style.margin = "0 0 14px";
        const title = document.createElement("strong");
        title.textContent = "찬송가 악보가 없습니다";
        const text = document.createElement("p");
        text.textContent = "「악보 가져오기」를 눌러 악보 이미지(1.jpg, 2.jpg … 장 번호가 파일명)를 선택하세요. 한 번 가져오면 이 기기에 저장되어 다시 고르지 않아도 되고, 인터넷 없이도 열립니다. 한 번에 고를 수 있는 수가 제한되면 나누어 여러 번 가져오세요. 이미 저장된 장은 그대로 유지됩니다.";
        box.append(title, text);
        hymnNotice.append(box);
      }
    }
    function renderHymnList() {
      const token = ++hymnRenderToken;
      hymnList.replaceChildren();
      if (!HYMN_BOOK.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        const title = document.createElement("strong");
        title.textContent = "찬송가 목록을 불러오지 못했습니다";
        empty.append(title);
        hymnList.append(empty);
        return;
      }
      const rows = filteredHymns();
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        const title = document.createElement("strong");
        title.textContent = "검색 결과가 없습니다";
        const text = document.createElement("p");
        text.textContent = "다른 장 번호나 제목으로 다시 검색해 보세요.";
        empty.append(title, text);
        hymnList.append(empty);
        return;
      }
      const fileList = document.createElement("div");
      fileList.className = "list files";
      hymnList.append(fileList);
      let i = 0;
      const addChunk = () => {
        if (token !== hymnRenderToken) return;
        const end = Math.min(i + 100, rows.length);
        for (; i < end; i += 1) {
          const hymn = rows[i];
          const has = hymnHas(hymn.n);
          addRow(fileList, has ? "file" : "file is-missing", `${hymn.n}장 ${hymn.title}`, has ? "" : "악보 없음", `hymn:${hymn.n}`, () => {
            openHymnNumber(hymn.n);
          });
        }
        if (i < rows.length) requestAnimationFrame(addChunk);
      };
      addChunk();
    }
    async function openHymnView() {
      if (viewMode !== "hymn") {
        closeHymnViewer();
        viewMode = "hymn";
        pushNav();
      }
      render();
      window.scrollTo(0, 0);
      if (hymmDirName() && !hymnIndexTask) {
        summary.textContent = "찬송가 이미지를 읽는 중입니다…";
        try {
          await indexHymnImages();
        } catch (error) {
          summary.textContent = "찬송가 이미지를 읽지 못했습니다.";
          render();
          return;
        }
        summary.textContent = "";
        if (viewMode === "hymn") render();
      }
    }
    function goHome() {
      if (current && !player.paused && !window.confirm("재생 중인 강의를 멈추고 홈으로 갈까요?")) return;
      resetPlayback();
      closeHymnViewer();
      path = basePath.slice();
      summary.textContent = "";
      const changed = viewMode !== "home";
      viewMode = "home";
      homeForced = true;
      if (changed) pushNav();
      render();
      window.scrollTo(0, 0);
    }
    function openLectures() {
      if (viewMode !== "lectures") {
        closeHymnViewer();
        viewMode = "lectures";
        pushNav();
      }
      render();
      window.scrollTo(0, 0);
    }
    async function openCanon(label) {
      closeHymnViewer();
      viewMode = "lectures";
      const name = findCanonDir(label);
      if (!name) {
        summary.textContent = `${label} 폴더를 찾지 못했습니다.`;
        path = basePath.slice();
        render();
        return;
      }
      summary.textContent = "";
      path = basePath.concat(name);
      pushNav();
      render();
      await ensurePathLoaded(path);
      window.scrollTo(0, 0);
      render();
    }
    async function openHymnNumber(n) {
      if (hymmDirName() && !hymnIndexTask) {
        try { await indexHymnImages(); } catch (error) {}
      }
      hymnNavList = filteredHymns();
      const index = hymnNavList.findIndex((hymn) => hymn.n === n);
      if (index < 0) return;
      showHymnViewer(index);
    }
    async function showHymnViewer(index, fromNav) {
      const hymn = hymnNavList[index];
      if (!hymn) return;
      const token = ++hymnShowToken;
      const wasHidden = hymnViewer.hidden;
      hymnViewIndex = index;
      hymnViewer.hidden = false;
      document.body.classList.add("hymn-open");
      if (!fromNav) {
        if (wasHidden) pushNav();
        else replaceNav();
      }
      resetHymnZoom();
      hymnViewerTitle.textContent = `${hymn.n}장 ${hymn.title}`;
      hymnPrev.disabled = index <= 0;
      hymnNext.disabled = index >= hymnNavList.length - 1;
      hymnImage.hidden = true;
      hymnImage.removeAttribute("src");
      hymnViewerMsg.hidden = false;
      hymnViewerMsg.textContent = "이미지를 불러오는 중입니다…";
      hymnViewerStage.scrollTop = 0;
      hymnViewerStage.scrollLeft = 0;
      syncHymnAudio();
      if (hymnObjectUrl) {
        URL.revokeObjectURL(hymnObjectUrl);
        hymnObjectUrl = "";
      }
      try {
        const file = await getHymnFile(hymn.n);
        if (token !== hymnShowToken) return;
        if (!file) {
          hymnViewerMsg.textContent = "이 장의 악보가 없습니다. 목록 화면의 「악보 가져오기」로 추가해 주세요.";
          return;
        }
        hymnObjectUrl = URL.createObjectURL(file);
        hymnImage.alt = `${hymn.n}장 ${hymn.title}`;
        hymnImage.src = hymnObjectUrl;
        hymnImage.hidden = false;
        hymnViewerMsg.hidden = true;
      } catch (error) {
        if (token !== hymnShowToken) return;
        hymnViewerMsg.textContent = "이미지를 열 수 없습니다.";
      }
    }
    function stepHymn(delta) {
      if (hymnViewer.hidden) return;
      const next = hymnViewIndex + delta;
      if (next < 0 || next >= hymnNavList.length) return;
      showHymnViewer(next);
    }
    function syncHymnAudio() {
      if (!hymnAudio) return;
      const ready = Boolean(current);
      const playing = ready && !player.paused && !player.ended;
      hymnAudio.disabled = !ready;
      hymnAudio.textContent = !ready ? "강의 없음" : (playing ? "⏸ 강의 일시정지" : "▶ 강의 재생");
    }

    /* ---- 배속·음량 접기 ---- */
    let fineOpen = false;
    try { fineOpen = localStorage.getItem("lecture-fine") === "1"; } catch (error) {}
    function updateFineLabel() {
      if (!fineToggle) return;
      fineToggle.textContent = `배속 ${formatSpeed(currentSpeed)} · 음량 ${formatVolume(currentVolume)} ${fineOpen ? "▴" : "▾"}`;
      fineToggle.setAttribute("aria-expanded", fineOpen ? "true" : "false");
      slidersBox.hidden = !fineOpen;
    }

    /* ================= 폰에 저장(앱 전용 저장소 OPFS) ================= */
    const LIB_NAME = "저장된 강의";
    const saveBtn = document.getElementById("saveBtn");
    const saveInput = document.getElementById("saveInput");
    const opfsOk = Boolean(navigator.storage && typeof navigator.storage.getDirectory === "function");
    let usingLibrary = false;
    let saveBusy = false;

    function safeSegment(name) {
      const cleaned = String(name || "").replace(/[\\/:*?"<>|]/g, "_").trim();
      return cleaned === "." || cleaned === ".." ? "_" : cleaned;
    }
    async function getLibraryDir(create) {
      const root = await navigator.storage.getDirectory();
      return root.getDirectoryHandle(LIB_NAME, { create: Boolean(create) });
    }
    async function libraryHasFiles(dir) {
      for await (const entry of dir.entries()) { void entry; return true; }
      return false;
    }
    function updateSourceButtons() {
      saveBtn.hidden = !opfsOk;
      saveBtn.textContent = usingLibrary ? "강의 추가 저장" : "장치에 저장";
      changeBtn.textContent = usingLibrary ? "저장 삭제" : changeLabel();
      changeBtn.classList.toggle("warn", usingLibrary);
    }
    async function openLibrary() {
      const dir = await getLibraryDir(false);
      await openRootHandle(dir);
      usingLibrary = true;
      updateSourceButtons();
    }
    async function walkForSave(dirHandle, parts, out) {
      for await (const [name, child] of dirHandle.entries()) {
        if (!name || name.startsWith(".")) continue;
        if (child.kind === "directory") await walkForSave(child, parts.concat(name), out);
        else if (child.kind === "file") out.push({ parts, name, getFile: () => child.getFile(), hasRel: true });
      }
    }
    function candidatesFromInput(files) {
      return files.map((file) => {
        const rel = file.webkitRelativePath || "";
        const parts = splitPath(rel);
        const name = parts.length ? parts.pop() : file.name;
        return { parts, name, getFile: async () => file, hasRel: Boolean(rel), fromInputRel: Boolean(rel), size: file.size };
      });
    }

        saveInput.click();

    async function runSave(cands, defaultGroup) {
      if (saveBusy) return;
      saveBusy = true;
      let wake = null;
      try {
        const audio = [];
        const images = [];
        for (const c of cands) {
          if (!c.name || c.name.startsWith(".")) continue;
          if (isMp3(c.name)) audio.push(c);
          else if (isImageName(c.name)) {
            const n = chapterFromName(c.name);
            if (n != null && HYMN_NUMBERS.has(n)) images.push(c);
          }
        }
        if (!audio.length && !images.length) {
          summary.textContent = "저장할 mp3 파일이나 장 번호 이미지를 찾지 못했습니다.";
          return;
        }
        /* 폴더 구조 정리: 폴더째 선택했다면 맨 위 폴더 이름은 빼고 저장 */
        let strip = false;
        if (audio.length && audio.every((c) => c.hasRel && c.parts.length >= 1 && c.fromInputRel)) {
          const first = audio[0].parts[0];
          strip = audio.every((c) => c.parts[0] === first);
        }
        let group = "";
        const flat = audio.length > 0 && audio.every((c) => (strip ? c.parts.length <= 1 : c.parts.length === 0));
        if (flat) {
          const answer = window.prompt("저장할 폴더 이름을 입력하세요. (예: 구약, 신약)\n비워 두면 맨 위에 저장합니다.", defaultGroup || (strip && audio[0].parts[0]) || "");
          if (answer === null) { summary.textContent = ""; return; }
          group = safeSegment(answer);
        }
        try { if (navigator.storage.persist) await navigator.storage.persist(); } catch (error) {}
        try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (error) {}

        /* 용량 확인 */
        const files = [];
        let totalBytes = 0;
        for (const c of audio) {
          const file = await c.getFile();
          files.push({ c, file });
          totalBytes += file.size;
        }
        try {
          const est = await navigator.storage.estimate();
          if (est && est.quota && totalBytes > est.quota - (est.usage || 0)) {
            const need = Math.ceil(totalBytes / 1048576);
            const free = Math.floor((est.quota - (est.usage || 0)) / 1048576);
            window.alert(`저장 공간이 부족합니다.\n필요: 약 ${need}MB / 사용 가능: 약 ${free}MB\n기기 저장 공간을 확보한 뒤 다시 시도해 주세요.`);
            summary.textContent = "저장 공간이 부족해 저장하지 않았습니다.";
            return;
          }
        } catch (error) {}

        if (images.length) {
          await importHymnFiles(await Promise.all(images.map((c) => c.getFile())));
        }

        let done = 0;
        let skipped = 0;
        if (files.length) {
          const lib = await getLibraryDir(true);
          for (const { c, file } of files) {
            let parts = strip ? c.parts.slice(1) : c.parts.slice();
            if (group) parts = [group].concat(parts);
            parts = parts.map(safeSegment).filter(Boolean);
            let dir = lib;
            for (const part of parts) dir = await dir.getDirectoryHandle(part, { create: true });
            const fileName = safeSegment(c.name);
            let exists = false;
            try {
              const existing = await (await dir.getFileHandle(fileName)).getFile();
              exists = existing.size === file.size;
            } catch (error) {}
            if (exists) {
              skipped += 1;
            } else {
              const handle = await dir.getFileHandle(fileName, { create: true });
              const writable = await handle.createWritable();
              try {
                await writable.write(file);
                await writable.close();
              } catch (error) {
                try { await writable.abort(); } catch (inner) {}
                throw error;
              }
            }
            done += 1;
            summary.textContent = `장치에 저장 중… ${done}/${files.length}  (화면을 켜 두세요)`;
            if (done % 3 === 0) await yieldUi();
          }
        }
        const parts = [];
        if (files.length) parts.push(`강의 ${files.length}개${skipped ? `(이미 있던 ${skipped}개 포함)` : ""}`);
        if (images.length) parts.push(`악보 ${images.length}장`);
        const message = `장치에 저장했습니다: ${parts.join(" · ")}`;
        if (files.length) {
          resetPlayback();
          await openLibrary();
        } else {
          render();
        }
        summary.textContent = message;
      } catch (error) {
        const full = error && (error.name === "QuotaExceededError" || /quota/i.test(String(error.message)));
        summary.textContent = full
          ? "저장 공간이 부족해 중단되었습니다. 이미 저장된 파일은 유지됩니다."
          : "저장 중 오류가 발생했습니다. 다시 시도하면 저장된 파일은 건너뛰고 이어서 저장합니다.";
      } finally {
        saveBusy = false;
        try { if (wake) await wake.release(); } catch (error) {}
      }
    }

      let pinch = null;
      let swipe = null;
      let lastTap = { t: 0, x: 0, y: 0 };
      const dist = (touches) => Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );
      stage.addEventListener("touchstart", (event) => {
        if (event.touches.length === 2) {
          pinch = { d: dist(event.touches), z: hymnZoom };
          swipe = null;
        } else if (event.touches.length === 1) {
          const t = event.touches[0];
          swipe = { x: t.clientX, y: t.clientY, t: Date.now() };
          pinch = null;
        }
      }, { passive: true });
      stage.addEventListener("touchmove", (event) => {
        if (pinch && event.touches.length === 2) {
          event.preventDefault();
          const rect = stage.getBoundingClientRect();
          const cx = (event.touches[0].clientX + event.touches[1].clientX) / 2 - rect.left;
          const cy = (event.touches[0].clientY + event.touches[1].clientY) / 2 - rect.top;
          setHymnZoom(pinch.z * dist(event.touches) / pinch.d, cx, cy);
        }
      }, { passive: false });
      stage.addEventListener("touchend", (event) => {
        if (pinch) {
          if (event.touches.length < 2) pinch = null;
          swipe = null;
          return;
        }
        if (!swipe || event.changedTouches.length !== 1) return;
        const t = event.changedTouches[0];
        const dx = t.clientX - swipe.x;
        const dy = t.clientY - swipe.y;
        const dt = Date.now() - swipe.t;
        swipe = null;
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
          const now = Date.now();
          if (now - lastTap.t < 320 && Math.abs(t.clientX - lastTap.x) < 30 && Math.abs(t.clientY - lastTap.y) < 30) {
            const rect = stage.getBoundingClientRect();
            setHymnZoom(hymnZoom > 1.05 ? 1 : 2.5, t.clientX - rect.left, t.clientY - rect.top);
            lastTap = { t: 0, x: 0, y: 0 };
          } else {
            lastTap = { t: now, x: t.clientX, y: t.clientY };
          }
          return;
        }
        if (hymnZoom <= 1.05 && dt < 700 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) {
          stepHymn(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
      stage.addEventListener("dblclick", (event) => {
        const rect = stage.getBoundingClientRect();
        setHymnZoom(hymnZoom > 1.05 ? 1 : 2.5, event.clientX - rect.left, event.clientY - rect.top);
      });
    })();

    document.addEventListener("keydown", (event) => {
      if (hymnViewer.hidden) return;
      if (event.key === "Escape") {
        event.preventDefault();
        requestCloseViewer();
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        stepHymn(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        stepHymn(1);
      } else if (event.key === "+" || event.key === "=") {
        setHymnZoom(hymnZoom * 1.3);
      } else if (event.key === "-") {
        setHymnZoom(hymnZoom / 1.3);
      }
    });

    updateFineLabel();
    replaceNav();
    loadStoredHymns();
    initSources();
  </script>
</body>
</html>
