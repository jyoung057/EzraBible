    function renderIndexList() {
      list.replaceChildren();
      const group = LECT.find((g) => g.t === indexT);
      if (!group) return;
      const missingNote = () => {
        summary.textContent = "이 강의 파일이 기기에 없습니다. 「장치에 저장」으로 mp3를 추가해 주세요.";
        setTimeout(() => {
          if (summary.textContent.startsWith("이 강의 파일이 기기에 없습니다")) summary.textContent = "";
        }, 4000);
      };
      const haveCount = (rows) => rows.filter((row) => lectAvail.has(nfc(row[0]))).length;
      if (indexF == null) {
        const all = group.folders.flatMap((f) => f.f);
        if (!lectScanning && haveCount(all) === 0) {
          const box = document.createElement("div");
          box.className = "empty";
          box.style.margin = "0 0 14px";
          const title = document.createElement("strong");
          title.textContent = "아직 이 기기에 강의 파일이 없습니다";
          const text = document.createElement("p");
          text.textContent = "목록은 미리 들어 있습니다. 「장치에 저장」으로 강의 mp3를 한 번 저장하면 여기서 바로 재생됩니다.";
          box.append(title, text);
          list.append(box);
        }
        const folderList = document.createElement("div");
        folderList.className = "list";
        for (const folder of group.folders) {
          addRow(folderList, "dir", folder.n, `${haveCount(folder.f)}/${folder.f.length}`, `ix:${folder.n}`, () => {
            indexF = folder.n;
            pushNav();
            render();
            window.scrollTo(0, 0);
          });
        }
        list.append(folderList);
        return;
      }
      const folder = group.folders.find((f) => f.n === indexF);
      if (!folder) return;
      const avail = [];
      const items = folder.f.map((row) => {
        const found = lectAvail.get(nfc(row[0])) || null;
        if (found) avail.push(found);
        return { row, found };
      });
      const fileList = document.createElement("div");
      fileList.className = "list files";
      for (const { row, found } of items) {
        const label = displayName(row[0]);
        if (found) {
          addRow(fileList, "file", label, formatDuration(row[1]), found.relativePath, () => playItem(found, avail));
        } else {
          addRow(fileList, "file is-missing", label, `${formatDuration(row[1])} · ${lectScanning ? "확인 중…" : "파일 없음"}`, `missing:${row[0]}`, missingNote);
        }
      }
      list.append(fileList);
      markActive();
    }

    function renderHome(canonOT, canonNT) {
      const ICONS = {
        ot: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></svg>',
        nt: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M6.5 8.5h11"/></svg>',
        hymn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
        list: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
      };
      homePanel.replaceChildren();

      const hero = document.createElement("div");
      hero.className = "hero";
      hero.innerHTML = '<svg class="hills" viewBox="0 0 400 240" preserveAspectRatio="none" aria-hidden="true">'
        + '<path d="M0 120 L70 70 L130 105 L210 40 L290 100 L350 70 L400 95 L400 240 L0 240Z" fill="rgba(20,45,48,0.28)"/>'
        + '<path d="M0 165 L60 130 L140 160 L230 110 L320 155 L400 130 L400 240 L0 240Z" fill="rgba(15,35,40,0.38)"/>'
        + '<path d="M0 205 C90 185 180 215 280 195 C340 183 380 195 400 190 L400 240 L0 240Z" fill="rgba(10,28,32,0.45)"/></svg>';

      const text = document.createElement("div");
      text.className = "hero-text";
      const l1 = document.createElement("span");
      l1.textContent = "노우호목사님";
      const l2 = document.createElement("span");
      l2.className = "l2";
      l2.textContent = "성경강해";
      text.append(l1, l2);

      const tiles = document.createElement("div");
      tiles.className = "hero-tiles";
      const note = (message) => {
        summary.textContent = message;
        setTimeout(() => { if (summary.textContent === message) summary.textContent = ""; }, 4000);
      };
      const addTile = (label, icon, handler, off, wide) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tile" + (off ? " is-off" : "") + (wide ? " wide" : "");
        btn.innerHTML = icon;
        const name = document.createElement("span");
        name.textContent = label;
        btn.append(name);
        btn.addEventListener("click", handler);
        tiles.append(btn);
      };
      addTile("구약", ICONS.ot, () => openIndex("구약"), false);
      addTile("신약", ICONS.nt, () => openIndex("신약"), false);
      addTile("찬송가", ICONS.hymn, openHymnView, false);
      if (loaded) addTile("저장된 전체 파일 보기", ICONS.list, openLectures, false, true);
      hero.append(text, tiles);

      const verse = document.createElement("figure");
      verse.className = "verse";
      const quote = document.createElement("blockquote");
      quote.textContent = "“이 예언의 말씀을 읽는 자와 듣는 자와 그 가운데에 기록한 것을 지키는 자는 복이 있나니 때가 가까움이라”";
      const cap = document.createElement("figcaption");
      cap.textContent = "계시록 1:3";
      const ver = document.createElement("div");
      ver.className = "app-ver";
      ver.textContent = `v ${APP_VERSION}`;
      verse.append(quote, cap, ver);

      homePanel.append(hero, verse);
    }

    function render() {
      const canonOT = loaded ? findCanonDir("구약") : "";
      const canonNT = loaded ? findCanonDir("신약") : "";
      const hymnOn = viewMode === "hymn";
      const homeOn = viewMode === "home";
      document.body.classList.toggle("is-home", homeOn);
      hymnPanel.hidden = !hymnOn;
      homePanel.hidden = !homeOn;
      if (homeOn) renderHome(canonOT, canonNT);
      list.hidden = hymnOn || (homeOn && loaded);

      if (hymnOn) {
        listNav.hidden = true;
        upBtn.hidden = true;
        updateHymnPanel();
        renderHymnList();
        renderSummary();
        return;
      }

      if (viewMode === "index") {
        list.hidden = false;
        listNav.hidden = false;
        upBtn.hidden = false;
        renderIndexCrumbs();
        renderSummary();
        renderIndexList();
        ensureLectureRegistry().then(() => {
          if (viewMode !== "index") return;
          renderSummary();
          renderIndexList();
        });
        return;
      }

      if (homeOn && loaded) {
        listNav.hidden = true;
        upBtn.hidden = true;
        renderSummary();
        return;
      }

      const node = nodeAt(path);
      const canGoUp = loaded && path.length > basePath.length;
      upBtn.hidden = !canGoUp;
      renderCrumbs();
      renderSummary();
      renderList(node);
      markActive();
    }

    let seeking = false;

    function clock(seconds) {
      return formatDuration(seconds) || "0:00";
    }

    function paintSeek() {
      paintRange(seek);
    }

    function syncPlayerUi() {
      const ready = Boolean(current);
      playBtn.disabled = !ready;
      seek.disabled = !ready;
      playerBar.hidden = !ready && !nowPath.textContent;
      const playing = ready && !player.paused && !player.ended;
      playBtn.replaceChildren();
      if (playing) {
        const icon = document.createElement("span");
        icon.className = "pause-icon";
        icon.append(document.createElement("span"), document.createElement("span"));
        playBtn.append(icon);
        playBtn.setAttribute("aria-label", "일시정지");
      } else {
        const icon = document.createElement("span");
        icon.className = "play-icon";
        playBtn.append(icon);
        playBtn.setAttribute("aria-label", "재생");
      }
      if (!seeking) {
        const duration = Number.isFinite(player.duration) ? player.duration : 0;
        seek.max = String(duration);
        seek.value = String(player.currentTime || 0);
      }
      timeNow.textContent = clock(Number(seek.value) || 0);
      timeTotal.textContent = clock(Number.isFinite(player.duration) ? player.duration : 0);
      paintSeek();
      syncHymnAudio();
    }

    picker.addEventListener("change", async () => {
      if (!picker.files || !picker.files.length) {
        summary.textContent = "";
        return;
      }
      try {
        const entries = picker.webkitEntries || [];
        const dirEntry = Array.from(entries).find((entry) => entry && entry.isDirectory);
        if (dirEntry && typeof dirEntry.createReader === "function") {
          await openRootEntry(dirEntry);
        } else if (isMobile) {
          loadFlatFiles(picker.files);
        } else {
          await loadItemsProgressive(picker.files);
        }
      } catch (error) {
        if (isMobile) loadFlatFiles(picker.files);
        else await loadItemsProgressive(picker.files);
      }
      picker.value = "";
    });

    prevBtn.addEventListener("click", () => playDelta(-1));
    nextBtn.addEventListener("click", () => playDelta(1));
    upBtn.addEventListener("click", async () => {
      if (viewMode === "index") {
        if (indexF != null) {
          indexF = null;
        } else {
          viewMode = "home";
          homeForced = true;
        }
        pushNav();
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (path.length <= basePath.length) return;
      path = path.slice(0, -1);
      pushNav();
      await ensurePathLoaded(path);
      window.scrollTo(0, 0);
      render();
    });

    playBtn.addEventListener("click", async () => {
      if (!current) return;
      if (player.paused || player.ended) {
        await unlockAudio();
        applyVolume();
        if (player.ended) player.currentTime = 0;
        player.play().catch(() => {});
      } else {
        player.pause();
      }
    });

    seek.addEventListener("input", () => {
      seeking = true;
      timeNow.textContent = clock(Number(seek.value) || 0);
      paintSeek();
    });

    seek.addEventListener("change", () => {
      if (!current) return;
      player.currentTime = Number(seek.value) || 0;
      seeking = false;
      syncPlayerUi();
    });

    player.addEventListener("loadedmetadata", () => {
      applySpeed();
      syncPlayerUi();
    });
    player.addEventListener("timeupdate", syncPlayerUi);
    player.addEventListener("play", () => {
      applySpeed();
      syncPlayerUi();
    });
    player.addEventListener("pause", syncPlayerUi);
    player.addEventListener("ended", () => {
      playDelta(1);
      syncPlayerUi();
    });
    player.addEventListener("error", () => {
      nowPath.textContent = "이 파일을 재생할 수 없습니다.";
    });

    document.addEventListener("dragenter", (event) => {
      event.preventDefault();
      dragDepth += 1;
      document.body.classList.add("is-drag");
    });
    document.addEventListener("dragover", (event) => {
      event.preventDefault();
    });
    document.addEventListener("dragleave", () => {
      dragDepth -= 1;
      if (dragDepth <= 0) {
        dragDepth = 0;
        document.body.classList.remove("is-drag");
      }
    });
    document.addEventListener("drop", async (event) => {
      event.preventDefault();
      dragDepth = 0;
      document.body.classList.remove("is-drag");
      summary.textContent = "선택한 폴더만 읽는 중입니다…";
      try {
        const entries = [];
        for (const item of event.dataTransfer.items || []) {
          if (item.kind !== "file" || !item.webkitGetAsEntry) continue;
          const entry = item.webkitGetAsEntry();
          if (entry) entries.push(entry);
        }
        const dirEntry = entries.find((entry) => entry && entry.isDirectory);
        if (dirEntry) {
          await openRootEntry(dirEntry);
        } else {
          const items = await itemsFromDrop(event.dataTransfer);
          loadItems(items);
          summary.textContent = total ? "" : "선택한 폴더에서 mp3 파일을 찾지 못했습니다.";
        }
      } catch (error) {
        summary.textContent = "폴더를 읽지 못했습니다. 폴더 선택 버튼을 사용해 주세요.";
      }
    });

    if ("mediaSession" in navigator) {
      const actions = {
        play: async () => {
          await unlockAudio();
          applyVolume();
          return player.play();
        },
        pause: () => player.pause(),
        previoustrack: () => playDelta(-1),
        nexttrack: () => playDelta(1),
      };
      for (const [name, handler] of Object.entries(actions)) {
        try { navigator.mediaSession.setActionHandler(name, handler); } catch (error) {}
      }
    }

    setupPickerMode();
    applySpeed();
    applyVolume();
    updateTransport();
    syncPlayerUi();
    render();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    speed.addEventListener("input", () => {
      currentSpeed = Number(speed.value) || 1;
      applySpeed();
      try { localStorage.setItem(SPEED_KEY, String(currentSpeed)); } catch (error) {}
    });

    volume.addEventListener("input", async () => {
      currentVolume = Number(volume.value) || 0;
      await unlockAudio();
      applyVolume();
      try { localStorage.setItem(VOLUME_KEY, String(currentVolume)); } catch (error) {}
    });

    picker.addEventListener("cancel", () => { summary.textContent = ""; });
    function exitApp() {
      if (!window.confirm("프로그램을 종료할까요?" + (current && !player.paused ? "\n재생 중인 강의도 멈춥니다." : ""))) return;
      try { player.pause(); } catch (error) {}
      try { player.removeAttribute("src"); player.load(); } catch (error) {}
      try { if (currentUrl) URL.revokeObjectURL(currentUrl); } catch (error) {}
      currentUrl = "";
      try { if ("mediaSession" in navigator) navigator.mediaSession.metadata = null; } catch (error) {}
      try { if (audioCtx) audioCtx.close(); } catch (error) {}
      try { window.close(); } catch (error) {}
      setTimeout(() => {
        const box = document.createElement("div");
        box.className = "closed-screen";
        const msg = document.createElement("p");
        msg.textContent = "종료되었습니다. 앱 화면을 닫아 주세요.";
        const again = document.createElement("button");
        again.type = "button";
        again.className = "big-btn";
        again.textContent = "다시 시작";
        again.addEventListener("click", () => location.reload());
        box.append(msg, again);
        document.body.replaceChildren(box);
      }, 150);
    }
    document.getElementById("exitBtn").addEventListener("click", exitApp);

    updateSourceButtons();
    changeBtn.addEventListener("click", () => { if (usingLibrary) wipeLibrary(); else pickSource(); });
    saveBtn.addEventListener("click", saveAllToPhone);
    if (!isMobile) {
      saveInput.setAttribute("webkitdirectory", "");
      saveInput.setAttribute("directory", "");
    } else {
      saveInput.setAttribute("accept", "audio/*,image/*,.mp3");
    }
    saveInput.addEventListener("change", async () => {
      const files = Array.from(saveInput.files || []);
      saveInput.value = "";
      if (!files.length) { summary.textContent = ""; return; }
      await runSave(candidatesFromInput(files), "");
    });
    saveInput.addEventListener("cancel", () => { summary.textContent = ""; });
    homeBtn.addEventListener("click", goHome);

    function applyHymnSearch() {
      hymnSearchText = hymnQuery.value.trim();
      if (viewMode !== "hymn") return;
      summary.textContent = "";
      renderHymnList();
      renderSummary();
    }
    hymnQuery.addEventListener("input", () => {
      hymnClear.hidden = !hymnQuery.value;
      clearTimeout(hymnSearchTimer);
      hymnSearchTimer = setTimeout(applyHymnSearch, 120);
    });
    hymnSearch.addEventListener("submit", (event) => {
      event.preventDefault();
      clearTimeout(hymnSearchTimer);
      applyHymnSearch();
      hymnQuery.blur();
    });
    hymnClear.addEventListener("click", () => {
      hymnQuery.value = "";
      hymnClear.hidden = true;
      applyHymnSearch();
      hymnQuery.focus();
    });
    hymnKeys.addEventListener("click", () => {
      hymnNumeric = !hymnNumeric;
      hymnQuery.inputMode = hymnNumeric ? "numeric" : "search";
      hymnKeys.textContent = hymnNumeric ? "가" : "123";
      hymnKeys.setAttribute("aria-label", hymnNumeric ? "문자 키보드로 전환" : "숫자 키패드로 전환");
      hymnQuery.blur();
      hymnQuery.focus();
    });
    hymnImportBtn.addEventListener("click", () => hymnImportInput.click());
    hymnImportInput.addEventListener("change", async () => {
      const files = Array.from(hymnImportInput.files || []);
      hymnImportInput.value = "";
      if (files.length) await importHymnFiles(files);
    });
    hymnSaveBtn.addEventListener("click", saveSessionHymns);
    hymnWipeBtn.addEventListener("click", wipeHymns);
    fineToggle.addEventListener("click", () => {
      fineOpen = !fineOpen;
      try { localStorage.setItem("lecture-fine", fineOpen ? "1" : "0"); } catch (error) {}
      updateFineLabel();
    });

    hymnClose.addEventListener("click", requestCloseViewer);
    hymnAudio.addEventListener("click", () => { if (current) playBtn.click(); });
    hymnZoomIn.addEventListener("click", () => setHymnZoom(hymnZoom * 1.25));
    hymnZoomOut.addEventListener("click", () => setHymnZoom(hymnZoom / 1.25));
    hymnFitW.addEventListener("click", () => setHymnFit("w"));
    hymnFitH.addEventListener("click", () => setHymnFit("h"));
    hymnImage.addEventListener("load", () => {
      if (hymnViewer.hidden) return;
      applyHymnZoom();
      hymnImage.hidden = false;
      hymnViewerMsg.hidden = true;
      hymnViewerStage.scrollTop = 0;
      hymnViewerStage.scrollLeft = 0;
    });
    window.addEventListener("resize", () => {
      if (!hymnViewer.hidden && !hymnImage.hidden) applyHymnZoom();
    });
    hymnImage.addEventListener("error", () => {
      if (hymnViewer.hidden || !hymnImage.getAttribute("src")) return;
      hymnImage.hidden = true;
      hymnViewerMsg.hidden = false;
      hymnViewerMsg.textContent = "이 이미지를 표시할 수 없습니다.";
    });
    player.addEventListener("play", syncHymnAudio);
    player.addEventListener("pause", syncHymnAudio);

    /* 핀치 확대 · 더블탭 · 좌우 스와이프 */
    (function setupHymnGestures() {
      const stage = hymnViewerStage;
      let pinch = null;
      let swipe = null;
      let lastTap = { t: 0, x: 0, y: 0 };
      const dist = (touches) => Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );
      stage.addEventListener("touchstart", (event) => {
        if (event.touches.length === 2) {
          pinch = { d: dist(event.touches), z: hymnZoom };
          swipe = null;
        } else if (event.touches.length === 1) {
          const t = event.touches[0];
          swipe = { x: t.clientX, y: t.clientY, t: Date.now() };
          pinch = null;
        }
      }, { passive: true });
      stage.addEventListener("touchmove", (event) => {
        if (pinch && event.touches.length === 2) {
          event.preventDefault();
          const rect = stage.getBoundingClientRect();
          const cx = (event.touches[0].clientX + event.touches[1].clientX) / 2 - rect.left;
          const cy = (event.touches[0].clientY + event.touches[1].clientY) / 2 - rect.top;
          setHymnZoom(pinch.z * dist(event.touches) / pinch.d, cx, cy);
        }
      }, { passive: false });
      stage.addEventListener("touchend", (event) => {
        if (pinch) {
          if (event.touches.length < 2) pinch = null;
          swipe = null;
          return;
        }
        if (!swipe || event.changedTouches.length !== 1) return;
        const t = event.changedTouches[0];
        const dx = t.clientX - swipe.x;
        const dy = t.clientY - swipe.y;
        const dt = Date.now() - swipe.t;
        swipe = null;
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
          const now = Date.now();
          if (now - lastTap.t < 320 && Math.abs(t.clientX - lastTap.x) < 30 && Math.abs(t.clientY - lastTap.y) < 30) {
            const rect = stage.getBoundingClientRect();
            toggleHymnZoom(t.clientX - rect.left, t.clientY - rect.top);
            lastTap = { t: 0, x: 0, y: 0 };
          } else {
            lastTap = { t: now, x: t.clientX, y: t.clientY };
          }
          return;
        }
        if (stage.scrollWidth <= stage.clientWidth + 2 && dt < 700 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) {
          stepHymn(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
      stage.addEventListener("dblclick", (event) => {
        const rect = stage.getBoundingClientRect();
        toggleHymnZoom(event.clientX - rect.left, event.clientY - rect.top);
      });
    })();

    document.addEventListener("keydown", (event) => {
      if (hymnViewer.hidden) return;
      if (event.key === "Escape") {
        event.preventDefault();
        requestCloseViewer();
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        stepHymn(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        stepHymn(1);
      } else if (event.key === "+" || event.key === "=") {
        setHymnZoom(hymnZoom * 1.25);
      } else if (event.key === "-") {
        setHymnZoom(hymnZoom / 1.25);
      }
    });

    updateFineLabel();
    replaceNav();
    loadStoredHymns();
    initSources();
  </script>
</body>
